name: Adapter - C# Driver

on:
  push:
    branches: [main]
    paths:
      - 'cql-adapters/csharp-driver/**'
      - 'cql-adapters/workloads/**'
      - '.github/workflows/adapter-csharp-driver.yml'
  pull_request:
    paths:
      - 'cql-adapters/csharp-driver/**'
      - 'cql-adapters/workloads/**'
      - '.github/workflows/adapter-csharp-driver.yml'

defaults:
  run:
    working-directory: cql-adapters/csharp-driver/src

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test || echo "No tests found"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build release
        run: dotnet publish -c Release -r linux-x64 --self-contained true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: latte-driver-csharp
          path: cql-adapters/csharp-driver/src/bin/Release/net8.0/linux-x64/publish/
          retention-days: 1

  integration:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      scylla:
        image: scylladb/scylla:latest
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT now() FROM system.local'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo (latte)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-latte-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-latte-

      - name: Build latte
        working-directory: .
        run: cargo build --release

      - name: Download adapter artifact
        uses: actions/download-artifact@v4
        with:
          name: latte-driver-csharp
          path: cql-adapters/csharp-driver/src/bin/Release/net8.0/linux-x64/publish/

      - name: Make binaries executable
        run: |
          chmod +x target/release/latte
          chmod +x cql-adapters/csharp-driver/src/bin/Release/net8.0/linux-x64/publish/latte-driver-csharp
        working-directory: .

      - name: Run integration tests
        working-directory: cql-adapters/csharp-driver
        run: make test-integration
        env:
          LATTE_BIN: ${{ github.workspace }}/target/release/latte
          SCYLLA_CONTACT_POINTS: 127.0.0.1:9042

  benchmark:
    name: Benchmark Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      scylla:
        image: scylladb/scylla:latest
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT now() FROM system.local'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo (latte)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-latte-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-latte-

      - name: Build latte
        working-directory: .
        run: cargo build --release

      - name: Download adapter artifact
        uses: actions/download-artifact@v4
        with:
          name: latte-driver-csharp
          path: cql-adapters/csharp-driver/src/bin/Release/net8.0/linux-x64/publish/

      - name: Make binaries executable
        run: |
          chmod +x target/release/latte
          chmod +x cql-adapters/csharp-driver/src/bin/Release/net8.0/linux-x64/publish/latte-driver-csharp
        working-directory: .

      - name: Run benchmark tests
        working-directory: cql-adapters/csharp-driver
        run: make test-benchmark
        env:
          LATTE_BIN: ${{ github.workspace }}/target/release/latte
          SCYLLA_CONTACT_POINTS: 127.0.0.1:9042
          BENCHMARK_DURATION: 5s
